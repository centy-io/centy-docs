# yaml-language-server: $schema=https://raw.githubusercontent.com/tupe12334/linecheck/main/schema/linecheck.schema.json

rules:
  # Docs pages: warn only for now — docs/cli-reference.md is already 768 lines.
  - pattern: "**/*.md"
    warn: 300
    warn_message: "Long doc page — consider splitting it into focused pages"

  # Docusaurus config and scripts: the --default preset (warn 200 / error 400).
  - pattern: "**/*.ts"
    warn: 200
    warn_message: "Getting long — consider extracting helpers"
    error: 400
    error_message: "Too large to review easily; split this file now"
  - pattern: "**/*.tsx"
    warn: 200
    warn_message: "Getting long — consider extracting a component"
    error: 400
    error_message: "Too large to review easily; split this file now"
  - pattern: "**/*.js"
    warn: 200
    warn_message: "Getting long — consider extracting helpers"
    error: 400
    error_message: "Too large to review easily; split this file now"
  - pattern: "**/*.css"
    warn: 300
    warn_message: "Long stylesheet — consider splitting by concern"
    error: 600
    error_message: "Stylesheet too large; split it by concern"

exclude:
  # Machine-generated lockfile.
  - "pnpm-lock.yaml"
  # Agent prompt files, not reviewed source.
  - ".claude/**"
  - ".kiro/**"
  # Docusaurus translation catalogs are generated by `write-translations`.
  - "i18n/**"
  # Build output and dependencies.
  - "node_modules/**"
  - "build/**"
  - ".docusaurus/**"
